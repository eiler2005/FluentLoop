services:
  fluentloop:
    container_name: fluentloop-bot
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; Path('/app/data').mkdir(exist_ok=True); assert Path('/app/data').exists()"]
      interval: 60s
      timeout: 5s
      retries: 3

