name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Ruff
        run: uv run --python 3.11 --with ruff ruff check src tests scripts

      - name: Tests
        run: uv run --python 3.11 --with pytest --with pytest-asyncio pytest -q
