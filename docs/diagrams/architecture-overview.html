<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FluentLoop architecture overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      :root { --paper:#f7fbf4; --ink:#20312b; --muted:#4d6558; --soft:#718577; --rule:#d2dfcd; --accent:#5aa94b; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,Arial,sans-serif; }
      main { max-width:1360px; margin:0 auto; padding:36px 28px 44px; }
      .eyebrow { color:var(--accent); font:500 11px/1.2 "Geist Mono",monospace; letter-spacing:.14em; text-transform:uppercase; }
      h1 { margin:8px 0; font:400 46px/.95 "Instrument Serif",serif; letter-spacing:-.03em; }
      p { max-width:790px; margin:0 0 24px; color:var(--muted); font-size:16px; line-height:1.5; }
      .diagram { overflow-x:auto; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
      svg { display:block; min-width:1280px; width:100%; height:auto; }
      @media (max-width:640px) { main { padding:24px 16px 32px; } h1 { font-size:36px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">FluentLoop · current production shape</div>
      <h1>One Telegram surface, one private learning record</h1>
      <p>The bot keeps its interaction, plan-aware Study selector, content surfaces and operations deliberately small. Public curriculum is shared; plans, attempts and evidence remain isolated per learner.</p>
      <div class="diagram">
        <svg viewBox="0 0 1280 640" role="img" aria-labelledby="architecture-title architecture-desc">
          <title id="architecture-title">FluentLoop production architecture</title>
          <desc id="architecture-desc">Telegram connects to the Telethon bot and state. The bot routes users to a plan-aware Study selector, materials and practice, and configured AI capabilities. Personal plans, content and attempts are stored in SQLite per user, while APScheduler handles background jobs.</desc>
          <defs>
            <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4d6558"/></marker>
            <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5aa94b"/></marker>
          </defs>
          <rect width="1280" height="640" fill="#f7fbf4"/>
          <rect x="0" y="0" width="1280" height="44" fill="#edf6e8"/>
          <text x="24" y="28" fill="#718577" font-family="Geist Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.4">TELEGRAM · RUNTIME · PRIVATE EVIDENCE</text>

          <rect x="28" y="146" width="1224" height="300" rx="8" fill="rgba(32,49,43,.02)" stroke="#d2dfcd" stroke-width="1"/>
          <rect x="44" y="150" width="96" height="16" rx="2" fill="#f7fbf4"/>
          <text x="92" y="162" text-anchor="middle" fill="#718577" font-family="Geist Mono, monospace" font-size="8" letter-spacing="1">BOT RUNTIME</text>

          <!-- draw connectors before nodes so every card remains legible -->
          <line x1="640" y1="126" x2="640" y2="188" stroke="#4d6558" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
          <path d="M 514 234 H 386 V 324" fill="none" stroke="#4d6558" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
          <line x1="640" y1="280" x2="640" y2="324" stroke="#5aa94b" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
          <path d="M 766 234 H 918 V 324" fill="none" stroke="#4d6558" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
          <path d="M 142 420 V 444 H 532 V 374 H 548" fill="none" stroke="#4d6558" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
          <path d="M 378 420 V 456 H 600 V 504" fill="none" stroke="#4d6558" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
          <line x1="640" y1="420" x2="640" y2="504" stroke="#5aa94b" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
          <path d="M 1142 420 V 468 H 712 V 504" fill="none" stroke="#4d6558" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#architecture-arrow)"/>

          <g>
            <rect x="514" y="58" width="252" height="68" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="526" y="70" width="62" height="16" rx="2" fill="#e3f0df"/>
            <text x="557" y="82" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">CHANNEL</text>
            <text x="526" y="108" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Telegram · private chat or forum</text>
          </g>
          <g>
            <rect x="514" y="188" width="252" height="92" rx="6" fill="#eef8eb" stroke="#5aa94b" stroke-width="1.4"/>
            <rect x="526" y="200" width="46" height="16" rx="2" fill="#b9ddb1"/>
            <text x="549" y="212" text-anchor="middle" fill="#356a2d" font-family="Geist Mono, monospace" font-size="7" font-weight="500">CORE</text>
            <text x="526" y="242" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Telethon bot + saved state</text>
            <text x="526" y="263" fill="#4d6558" font-family="Geist, sans-serif" font-size="10">commands · keyboards · routing</text>
          </g>
          <g>
            <rect x="44" y="324" width="196" height="96" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="56" y="336" width="48" height="16" rx="2" fill="#e3f0df"/>
            <text x="80" y="348" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">PLAN</text>
            <text x="56" y="376" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Personal roadmap</text>
            <text x="56" y="397" fill="#718577" font-family="Geist, sans-serif" font-size="10">30/70 mix · track · focus · pause</text>
          </g>
          <g>
            <rect x="276" y="324" width="204" height="96" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="288" y="336" width="60" height="16" rx="2" fill="#e3f0df"/>
            <text x="318" y="348" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">CONTENT</text>
            <text x="288" y="376" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Materials + practice</text>
            <text x="288" y="397" fill="#718577" font-family="Geist, sans-serif" font-size="10">uploads · shared library · scenarios</text>
          </g>
          <g>
            <rect x="548" y="324" width="184" height="96" rx="6" fill="#eef8eb" stroke="#5aa94b" stroke-width="1.4"/>
            <rect x="560" y="336" width="48" height="16" rx="2" fill="#b9ddb1"/>
            <text x="584" y="348" text-anchor="middle" fill="#356a2d" font-family="Geist Mono, monospace" font-size="7" font-weight="500">STUDY</text>
            <text x="560" y="376" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Plan-aware selector</text>
            <text x="560" y="397" fill="#4d6558" font-family="Geist, sans-serif" font-size="10">modules · adaptive topics · evidence</text>
          </g>
          <g>
            <rect x="820" y="324" width="200" height="96" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="832" y="336" width="42" height="16" rx="2" fill="#e3f0df"/>
            <text x="853" y="348" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">AI</text>
            <text x="832" y="376" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Configured AI gateway</text>
            <text x="832" y="397" fill="#718577" font-family="Geist, sans-serif" font-size="10">validated JSON · fallback · enrichment</text>
          </g>
          <g>
            <rect x="1050" y="324" width="184" height="96" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="1062" y="336" width="42" height="16" rx="2" fill="#e3f0df"/>
            <text x="1083" y="348" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">OPS</text>
            <text x="1062" y="376" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">APScheduler</text>
            <text x="1062" y="397" fill="#718577" font-family="Geist, sans-serif" font-size="10">backups · vocab · opt-in maintenance</text>
          </g>
          <g>
            <rect x="548" y="504" width="184" height="80" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="560" y="516" width="50" height="16" rx="2" fill="#e3f0df"/>
            <text x="585" y="528" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">STORE</text>
            <text x="560" y="554" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">SQLite · isolated learner record</text>
            <text x="560" y="572" fill="#718577" font-family="Geist, sans-serif" font-size="10">plan · sessions · attempts · evidence</text>
          </g>
          <text x="44" y="620" fill="#4d6558" font-family="Geist, sans-serif" font-size="11">Simple profiles start Study manually. Scheduled vocabulary and summaries serve advanced profiles; shared lessons are cloned before a learner records progress.</text>
        </svg>
      </div>
    </main>
  </body>
</html>
