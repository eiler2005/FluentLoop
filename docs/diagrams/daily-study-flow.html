<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FluentLoop Study loop</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      :root { --paper:#f7fbf4; --ink:#20312b; --muted:#4d6558; --soft:#718577; --rule:#d2dfcd; --accent:#5aa94b; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font-family:Geist,Arial,sans-serif; }
      main { max-width:1360px; margin:0 auto; padding:36px 28px 44px; }
      .eyebrow { color:var(--accent); font:500 11px/1.2 "Geist Mono",monospace; letter-spacing:.14em; text-transform:uppercase; }
      h1 { margin:8px 0; font:400 46px/.95 "Instrument Serif",serif; letter-spacing:-.03em; }
      p { max-width:790px; margin:0 0 24px; color:var(--muted); font-size:16px; line-height:1.5; }
      .diagram { overflow-x:auto; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
      svg { display:block; min-width:1280px; width:100%; height:auto; }
      @media (max-width:640px) { main { padding:24px 16px 32px; } h1 { font-size:36px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">FluentLoop · the current Study loop</div>
      <h1>Your plan chooses one readable next question</h1>
      <p>Study is a manual, phone-first loop: 30% general English, 40% work and language practice, 30% words and expressions. New meanings and spaced recall share the lexical part; independent writing is separate evidence.</p>
      <div class="diagram">
        <svg viewBox="0 0 1280 580" role="img" aria-labelledby="study-loop-title study-loop-desc">
          <title id="study-loop-title">FluentLoop plan-driven Study loop</title>
          <desc id="study-loop-desc">Study selects one question from three separate general, work and lexical shares, saves the answer with meaning and use feedback, and offers independent writing or a session result with Progress and Plan.</desc>
          <defs>
            <marker id="study-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4d6558"/></marker>
            <marker id="study-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5aa94b"/></marker>
          </defs>
          <rect width="1280" height="580" fill="#f7fbf4"/>
          <rect x="0" y="0" width="1280" height="44" fill="#edf6e8"/>
          <text x="24" y="28" fill="#718577" font-family="Geist Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.4">ONE CARD · SAVED PLAN · USEFUL FINISH</text>

          <!-- connectors stay behind cards and use open routing channels -->
          <line x1="204" y1="274" x2="260" y2="274" stroke="#4d6558" stroke-width="1.2" marker-end="url(#study-loop-arrow)"/>
          <line x1="460" y1="274" x2="510" y2="274" stroke="#5aa94b" stroke-width="1.4" marker-end="url(#study-loop-arrow-accent)"/>
          <path d="M 748 255 H 776 Q 784 255 784 263 V 274 H 804" fill="none" stroke="#4d6558" stroke-width="1.2" marker-end="url(#study-loop-arrow)"/>
          <path d="M 994 254 H 1016 Q 1024 254 1024 246 V 148 Q 1024 140 1032 140 H 1048" fill="none" stroke="#4d6558" stroke-width="1.2" marker-end="url(#study-loop-arrow)"/>
          <path d="M 700 350 V 450 H 1140 V 426" fill="none" stroke="#4d6558" stroke-width="1.2" marker-end="url(#study-loop-arrow)"/>

          <g>
            <rect x="44" y="224" width="160" height="100" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="56" y="236" width="48" height="16" rx="2" fill="#e3f0df"/>
            <text x="80" y="248" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">START</text>
            <text x="56" y="278" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Учиться /study</text>
            <text x="56" y="299" fill="#718577" font-family="Geist, sans-serif" font-size="10">resume a pending card</text>
          </g>
          <g>
            <rect x="260" y="204" width="200" height="140" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="272" y="216" width="62" height="16" rx="2" fill="#e3f0df"/>
            <text x="303" y="228" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">SELECTOR</text>
            <text x="272" y="258" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Choose the next card</text>
            <text x="272" y="281" fill="#4d6558" font-family="Geist, sans-serif" font-size="10">general 30 · work 40 · lexical 30</text>
            <text x="272" y="301" fill="#718577" font-family="Geist, sans-serif" font-size="10">focus · pause · stage · spacing</text>
            <text x="272" y="321" fill="#718577" font-family="Geist, sans-serif" font-size="10">modules · language · expressions</text>
          </g>
          <g>
            <rect x="510" y="160" width="238" height="190" rx="6" fill="#eef8eb" stroke="#5aa94b" stroke-width="1.4"/>
            <rect x="522" y="172" width="118" height="16" rx="2" fill="#b9ddb1"/>
            <text x="581" y="184" text-anchor="middle" fill="#356a2d" font-family="Geist Mono, monospace" font-size="7" font-weight="500">QUESTION 04 · B2+</text>
            <text x="522" y="216" fill="#20312b" font-family="Geist, sans-serif" font-size="15" font-weight="600">Customer escalation</text>
            <text x="522" y="242" fill="#4d6558" font-family="Geist, sans-serif" font-size="11">Choose the accurate and helpful reply.</text>
            <rect x="522" y="270" width="102" height="24" rx="12" fill="#ffffff" stroke="#d2dfcd"/>
            <text x="573" y="286" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="8" font-weight="500">A / B / C</text>
            <rect x="632" y="270" width="94" height="24" rx="12" fill="#ffffff" stroke="#d2dfcd"/>
            <text x="679" y="286" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="8" font-weight="500">НЕ ЗНАЮ</text>
            <text x="522" y="324" fill="#718577" font-family="Geist, sans-serif" font-size="10">Хватит /stop is available on the card</text>
          </g>
          <g>
            <rect x="804" y="204" width="190" height="140" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="816" y="216" width="46" height="16" rx="2" fill="#e3f0df"/>
            <text x="839" y="228" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">SAVE</text>
            <text x="816" y="258" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Short feedback</text>
            <text x="816" y="281" fill="#4d6558" font-family="Geist, sans-serif" font-size="10">meaning · form · example · register</text>
            <text x="816" y="301" fill="#718577" font-family="Geist, sans-serif" font-size="10">explanation and next eligible card</text>
            <text x="816" y="321" fill="#718577" font-family="Geist, sans-serif" font-size="10">pending question stays intact</text>
          </g>
          <g>
            <rect x="1048" y="86" width="184" height="108" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="1060" y="98" width="72" height="16" rx="2" fill="#e3f0df"/>
            <text x="1096" y="110" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">OPTIONAL</text>
            <text x="1060" y="140" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Own short writing</text>
            <text x="1060" y="161" fill="#718577" font-family="Geist, sans-serif" font-size="10">separate production signal</text>
            <text x="1060" y="179" fill="#718577" font-family="Geist, sans-serif" font-size="10">advance only after valid evidence</text>
          </g>
          <g>
            <rect x="1048" y="318" width="184" height="108" rx="6" fill="#ffffff" stroke="#20312b" stroke-width="1"/>
            <rect x="1060" y="330" width="52" height="16" rx="2" fill="#e3f0df"/>
            <text x="1086" y="342" text-anchor="middle" fill="#4d6558" font-family="Geist Mono, monospace" font-size="7" font-weight="500">STOP</text>
            <text x="1060" y="372" fill="#20312b" font-family="Geist, sans-serif" font-size="14" font-weight="600">Session result</text>
            <text x="1060" y="393" fill="#4d6558" font-family="Geist, sans-serif" font-size="10">accuracy · three-part mix</text>
            <text x="1060" y="411" fill="#718577" font-family="Geist, sans-serif" font-size="10">Progress · Plan · next action</text>
          </g>

          <rect x="0" y="480" width="1280" height="100" fill="#edf6e8"/>
          <text x="44" y="510" fill="#20312b" font-family="Geist, sans-serif" font-size="12" font-weight="600">Evidence stays specific</text>
          <text x="44" y="534" fill="#4d6558" font-family="Geist, sans-serif" font-size="11">Recognition, independent writing and external practice are reported separately. A session score is a practice signal, not a CEFR assessment.</text>
          <text x="44" y="556" fill="#4d6558" font-family="Geist, sans-serif" font-size="11">After each saved response, the selector repeats with the next eligible card; plan edits affect later selection, never the card already on screen.</text>
        </svg>
      </div>
    </main>
  </body>
</html>
