<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-overview-root">
          <title id="architecture-title">FluentLoop production architecture</title>
          <desc id="architecture-desc">Telegram connects to the Telethon bot and state. The bot routes users to a plan-aware Study selector, materials and practice, and configured AI capabilities. Personal plans, content and attempts are stored in SQLite per user, while APScheduler handles background jobs.</desc>
          <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-overview-root { --paper:#f7fbf4; --ink:#20312b; --muted:#4d6558; --soft:#718577; --rule:#d2dfcd; --accent:#5aa94b; }
      #architecture-overview-root { color: var(--ink); font-family: Geist,Arial,sans-serif; }
      #architecture-overview-root .diagram { overflow-x:auto; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }</style>
